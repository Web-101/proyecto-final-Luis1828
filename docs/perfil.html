<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CinePalace | Perfil</title>
  <link rel="stylesheet" href="css/comun.css">
  <link rel="stylesheet" href="css/perfil.css">
  <script defer src="js/utils.js"></script>
  <script defer src="js/perfil.js"></script>
</head>
<body>
  <div class="aplicacion">
    <div class="contenedor">
      <header class="encabezado">
        <a class="marca" href="index.html">
          <div class="marca__logo"><img src="assets/Logo.svg" alt="CinePalace"></div>
          <div>
            <div class="marca__nombre">CinePalace</div>
            <div class="marca__subtitulo">Mi perfil</div>
          </div>
        </a>

        <button class="boton-icono" type="button" id="botonAvisos" aria-label="Notificaciones">
          <img src="assets/notification.svg" alt="">
          <span class="boton-icono__contador" id="contadorAvisos">0</span>
        </button>
      </header>

      <main id="vistaPerfil"></main>
    </div>

    <footer class="navegacion-inferior">
      <nav class="navegacion-inferior__contenido" data-navegacion-inferior>
        <a href="index.html" data-pagina="cartelera"><img src="assets/Icon.svg" alt=""><span>Cartelera</span></a>
        <a href="buscar.html" data-pagina="buscar"><img src="assets/Icon-1.svg" alt=""><span>Buscar</span></a>
        <a href="perfil.html" data-pagina="perfil"><img src="assets/Icon-2.svg" alt=""><span>Perfil</span></a>
      </nav>
    </footer>
  </div>

  <div class="ventana" id="ventanaEntradas" aria-hidden="true">
    <div class="ventana__fondo" data-cerrar-ventana></div>
    <div class="ventana__panel" role="dialog" aria-modal="true" aria-labelledby="tituloEntradas">
      <div class="ventana__encabezado">
        <h2 id="tituloEntradas">Entradas compradas</h2>
        <button class="boton-icono boton-icono--pequeno" type="button" data-cerrar-ventana aria-label="Cerrar">
          <span aria-hidden="true">✕</span>
        </button>
      </div>
      <div id="listaEntradas" class="lista-entradas"></div>
    </div>
  </div>
</body>
</html>
